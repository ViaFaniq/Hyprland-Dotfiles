# --- CZCIONKA ---
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

# --- WYGLĄD OKNA ---
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
background_opacity 0.90

# --- PALETA KOLORÓW (Catppuccin Mocha) ---
foreground              #cdd6f4
background              #000000
selection_foreground    #1e1e2e
selection_background    #f5e0dc

# Kursor
cursor                  #f5e0dc
cursor_text_color       #1e1e2e
cursor_shape            block
cursor_blink_interval   0

# Adresy URL
url_color               #89b4fa

# Ramki okien Kitty
active_border_color     #89b4fa
inactive_border_color   #45475a
bell_border_color       #f38ba8

# Pasek kart (Tab bar)
tab_bar_style           powerline
active_tab_foreground   #11111b
active_tab_background   #89b4fa
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825

# 16 Kolorów terminala
# Czarny
color0 #45475a
color8 #585b70

# Czerwony
color1 #f38ba8
color9 #f38ba8

# Zielony
color2  #a6e3a1
color10 #a6e3a1

# Żółty
color3  #f9e2af
color11 #f9e2af

# Niebieski
color4  #89b4fa
color12 #89b4fa

# Różowy/Fioletowy
color5  #f5c2e7
color13 #f5c2e7

# Cyjan
color6  #94e2d5
color14 #94e2d5

# Biały
color7  #bac2de
color15 #a6adc8