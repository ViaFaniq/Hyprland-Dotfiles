# =======================
# HYPRLOCK CONFIGURATION
# =======================

general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    color = rgba(30, 30, 46, 1.0) # Base #1e1e2e
}

# ZEGAR (Godzina)
label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgba(205, 214, 244, 1.0) # Text #cdd6f4
    font_size = 80
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# DATA
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = rgba(166, 173, 200, 1.0) # Subtext0 #a6adc8
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}

# POLE HASŁA
input-field {
    monitor =
    size = 280, 45
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false

    outer_color = rgba(137, 180, 250, 1.0) # Blue #89b4fa
    inner_color = rgba(30, 30, 46, 0.9)   # Base #1e1e2e
    font_color = rgba(205, 214, 244, 1.0)  # Text #cdd6f4
    check_color = rgba(249, 226, 175, 1.0) # Yellow #f9e2af
    fail_color = rgba(243, 139, 168, 1.0)  # Red #f38ba8

    placeholder_text = <span foreground="##a6adc8">Wprowadź hasło...</span>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -80
    halign = center
    valign = center
}
